[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "extractor-facturas"
version = "1.0.0"
description = "Extractor de datos estructurados desde facturas electrónicas peruanas (SUNAT) con structured output y validación robusta."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Javier Arbulu" }]
dependencies = [
    "anthropic==1.11.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "jsonschema==4.26.0",
]

[project.scripts]
extractor = "extractor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
