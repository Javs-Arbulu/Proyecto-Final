[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "extractor-facturas"
version = "1.0.0"
description = "Extractor de datos estructurados desde facturas electrónicas peruanas (SUNAT) con structured output y validación robusta."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Javier Arbulu" }]
dependencies = [
    "cohere==7.2.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "jsonschema==4.26.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
extractor = "extractor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Aviso interno del SDK de Cohere (usa __fields__ de Pydantic v1); no es de este proyecto.
    "ignore:The `__fields__` attribute is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
